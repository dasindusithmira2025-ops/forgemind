[package]
name = "forgemind"
version = "0.4.5"
description = "PARALITH native multi-agent terminal workspace"
authors = ["Corelith Technologies"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "forgemind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
notify = "6.1"
# `unstable` enables the multi-webview API (`Window::add_child`) used to embed the isolated
# development-browser child webview beside the terminal canvas.
tauri = { version = "2.11.3", features = ["unstable"] }
tauri-plugin-log = "2"
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
parking_lot = "0.12.5"
portable-pty = "0.9.0"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
semver = "1.0"
sha2 = "0.10"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
wait-timeout = "0.2.1"
which = "8.0.4"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2.5.4"
url = "2.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }

[dev-dependencies]
minisign-verify = "0.2.5"
