name: Release

# Publish signed-by-default Windows installers (MSI + NSIS) whenever a version
# tag is pushed, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-action runs the beforeBuildCommand (npm run build), compiles the
      # Rust binary, and bundles the MSI + NSIS installers, then attaches them to
      # a draft GitHub release for the pushed tag.
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ForgeMind ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install ForgeMind.'
          releaseDraft: true
          prerelease: false
