name: Release Stable

on:
  push:
    tags: ['stable-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protected stable-vX.Y.Z tag
        required: true

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release-windows.yml
    with:
      edition: stable
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    secrets: inherit
