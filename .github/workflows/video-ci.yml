name: Validate product film

on:
  pull_request:
    paths:
      - 'marketing/paralith-video/**'
      - '.github/workflows/video-ci.yml'
  push:
    branches: [main, integration]
    paths:
      - 'marketing/paralith-video/**'
      - '.github/workflows/video-ci.yml'

permissions:
  contents: read

concurrency:
  group: validate-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-video:
    name: Validate Remotion source (GitHub Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: marketing/paralith-video

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: marketing/paralith-video/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Validate composition registry
        run: npm run validate

      - name: Render poster smoke
        run: npm run still
