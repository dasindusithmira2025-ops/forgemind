name: Validate product film

on:
  pull_request:
    paths:
      - 'marketing/paralith-video/**'
      - '.github/workflows/video-ci.yml'
  push:
    branches: [main, integration]
    paths:
      - 'marketing/paralith-video/**'
      - '.github/workflows/video-ci.yml'

permissions:
  contents: read

concurrency:
  group: validate-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-video:
    name: Validate Remotion source (GitHub Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: marketing/paralith-video

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: marketing/paralith-video/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install media probe
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffprobe -version | head -n 1

      - name: Validate composition registry
        run: npm run validate

      - name: Render poster smoke
        run: npm run still
