name: Validate website

on:
  pull_request:
    paths:
      - 'corelith-web/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main, integration]
    paths:
      - 'corelith-web/**'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

concurrency:
  group: validate-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-web:
    name: Validate website (GitHub Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: corelith-web

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: corelith-web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Next's production build includes its TypeScript and route-generation gates.
      - name: Build
        run: npm run build
