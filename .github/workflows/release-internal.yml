name: Release Internal

# Automatic internal delivery: every merge/push to `main` produces a unique, signed internal
# (preview-edition) build and publishes it to the internal update endpoint. Installed internal
# builds detect it and update on the next safe restart. No manual tagging or version editing is
# required. Stable customers are never affected — they read a different edition/endpoint and only
# receive tag-driven `stable-v*` releases (see release-stable.yml).

on:
  push:
    branches: [main]
    # Skip pushes that only touch docs/CI so we don't cut a build with no user-facing change.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

# One publish per commit. Do not cancel an in-progress publish (a half-published manifest is worse
# than a queued one); serialize instead so two runs never race on the same commit.
concurrency:
  group: release-internal-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Full CI gate — a failed check here prevents the release job from ever running.
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 60
    environment: preview-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Generate ephemeral internal version
        id: version
        shell: pwsh
        env:
          PARALITH_INTERNAL_BUILD_NUMBER: ${{ github.run_number }}
          PARALITH_GIT_COMMIT: ${{ github.sha }}
        run: |
          # Writes release/version.json + an ephemeral changelog for this run, then propagates the
          # version to package.json / Cargo.toml / tauri.conf.json / current-release.json. These
          # edits are NEVER committed back to main — they live only inside this runner.
          node scripts/release/internal-version.mjs apply
          npm run release:sync

      - name: Build signed internal MSI, NSIS, and updater artifacts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PARALITH_PREVIEW_UPDATE_ENDPOINT: ${{ vars.PARALITH_PREVIEW_UPDATE_ENDPOINT }}
          PARALITH_UPDATE_ARTIFACT_BASE_URL: ${{ vars.PARALITH_UPDATE_ARTIFACT_BASE_URL }}
          PARALITH_PREVIOUS_INSTALLER_URL: ${{ vars.PARALITH_PREVIOUS_INSTALLER_URL }}
          PARALITH_ROLLOUT_PERCENT: ${{ vars.PARALITH_ROLLOUT_PERCENT }}
          PARALITH_WINDOWS_SIGN_COMMAND: ${{ secrets.PARALITH_WINDOWS_SIGN_COMMAND }}
        run: |
          # Fail closed: no updater signing key means no publishable internal build.
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'TAURI_SIGNING_PRIVATE_KEY is required.' }
          $env:PARALITH_EDITION='preview'
          $env:PARALITH_RELEASE_CHANNEL='preview'
          $env:PARALITH_GIT_COMMIT=(git rev-parse HEAD).Trim()
          $env:PARALITH_BUILD_TIMESTAMP=(Get-Date).ToUniversalTime().ToString('o')
          if (-not $env:PARALITH_PREVIEW_UPDATE_ENDPOINT) { throw 'PARALITH_PREVIEW_UPDATE_ENDPOINT repository variable is required.' }
          $env:PARALITH_UPDATE_ENDPOINT=$env:PARALITH_PREVIEW_UPDATE_ENDPOINT
          $config = node scripts/release/render-tauri-config.mjs preview release | Select-Object -Last 1
          npm run tauri -- build --bundles msi,nsis --config $config
          node scripts/release/assemble-release.mjs preview

      - name: Archive workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paralith-internal-${{ steps.version.outputs.version }}
          path: .artifacts/release/preview/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish internal release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Get-ChildItem '.artifacts/release/preview' -Directory | Select-Object -First 1
          $notes = Join-Path $dir.FullName 'release-notes.md'
          $assets = Get-ChildItem $dir.FullName -File | ForEach-Object FullName
          # Non-draft prerelease keyed to the unique internal version — never conflicts with an
          # existing release, so no endless accumulating drafts.
          gh release create '${{ steps.version.outputs.tag }}' $assets `
            --title "PARALITH internal $($dir.Name)" `
            --notes-file $notes `
            --target '${{ github.sha }}' `
            --prerelease

      - name: Detect internal publication configuration
        id: publication
        shell: pwsh
        env:
          PUBLISH_TARGET: ${{ secrets.PARALITH_UPDATE_PUBLISH_TARGET }}
        run: |
          $enabled = if ($env:PUBLISH_TARGET) { 'true' } else { 'false' }
          "enabled=$enabled" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish to internal update endpoint
        if: steps.publication.outputs.enabled == 'true'
        shell: pwsh
        env:
          PARALITH_UPDATE_PUBLISH_TARGET: ${{ secrets.PARALITH_UPDATE_PUBLISH_TARGET }}
          PARALITH_UPDATE_PUBLISH_PROVIDER: ${{ vars.PARALITH_UPDATE_PUBLISH_PROVIDER }}
          PARALITH_UPDATE_PUBLISH_TOKEN: ${{ secrets.PARALITH_UPDATE_PUBLISH_TOKEN }}
        run: ./scripts/release/publish-internal-update.ps1
