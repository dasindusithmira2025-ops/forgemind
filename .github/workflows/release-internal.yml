name: Release Internal

# Automatic internal delivery: every merge/push to `main` produces a unique, signed internal
# (preview-edition) build and publishes it to the internal update endpoint. Installed internal
# builds detect it and update on the next safe restart. No manual tagging or version editing is
# required. Stable customers are never affected — they read a different edition/endpoint and only
# receive tag-driven `stable-v*` releases (see release-stable.yml).

on:
  push:
    branches: [main]
    # Skip pushes that only touch docs/CI so we don't cut a build with no user-facing change.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  FIREBASE_CLI_VERSION: 13.35.1

# One publish per commit. Do not cancel an in-progress publish (a half-published manifest is worse
# than a queued one); serialize instead so two runs never race on the same commit.
concurrency:
  group: release-internal-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Full CI gate — a failed check here prevents the release job from ever running.
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 60
    environment: preview-release
    # Reserved shared deployment lock: any future Firebase-backed Stable publisher must use this
    # exact group so Preview and Stable can never replace the Hosting site concurrently.
    concurrency:
      group: firebase-hosting-update-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # Fail fast BEFORE the expensive Windows build: a preview release that cannot publish its
      # manifest is worthless, so a missing publish key must stop the release here rather than
      # silently produce a GitHub-only prerelease no installed app can discover. Names only, no values.
      - name: Preview publish preflight
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PARALITH_PREVIEW_UPDATE_ENDPOINT: ${{ vars.PARALITH_PREVIEW_UPDATE_ENDPOINT }}
          PARALITH_UPDATE_ARTIFACT_BASE_URL: ${{ vars.PARALITH_UPDATE_ARTIFACT_BASE_URL }}
          PARALITH_UPDATE_PUBLISH_PROVIDER: ${{ vars.PARALITH_UPDATE_PUBLISH_PROVIDER }}
          PARALITH_UPDATE_PUBLISH_TARGET: ${{ secrets.PARALITH_UPDATE_PUBLISH_TARGET }}
          PARALITH_UPDATE_PUBLISH_TOKEN: ${{ secrets.PARALITH_UPDATE_PUBLISH_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PARALITH_INTERNAL_BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/release/preflight-publish.mjs

      - name: Generate ephemeral internal version
        id: version
        shell: pwsh
        env:
          PARALITH_INTERNAL_BUILD_NUMBER: ${{ github.run_number }}
          PARALITH_GIT_COMMIT: ${{ github.sha }}
        run: |
          # Writes release/version.json + an ephemeral changelog for this run, then propagates the
          # version to package.json / Cargo.toml / tauri.conf.json / current-release.json. These
          # edits are NEVER committed back to main — they live only inside this runner.
          node scripts/release/internal-version.mjs apply
          npm run release:sync

      - name: Confirm generated version is newer than installed Preview
        shell: pwsh
        run: node scripts/release/firebase-hosting-publisher.mjs version "${{ steps.version.outputs.version }}" '0.4.1-1001'

      - name: Build signed internal MSI, NSIS, and updater artifacts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PARALITH_PREVIEW_UPDATE_ENDPOINT: ${{ vars.PARALITH_PREVIEW_UPDATE_ENDPOINT }}
          PARALITH_UPDATE_ARTIFACT_BASE_URL: ${{ vars.PARALITH_UPDATE_ARTIFACT_BASE_URL }}
          PARALITH_PREVIOUS_INSTALLER_URL: ${{ vars.PARALITH_PREVIOUS_INSTALLER_URL }}
          PARALITH_ROLLOUT_PERCENT: ${{ vars.PARALITH_ROLLOUT_PERCENT }}
          PARALITH_WINDOWS_SIGN_COMMAND: ${{ secrets.PARALITH_WINDOWS_SIGN_COMMAND }}
        run: |
          # Fail closed: no updater signing key means no publishable internal build.
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'TAURI_SIGNING_PRIVATE_KEY is required.' }
          $env:PARALITH_EDITION='preview'
          $env:PARALITH_RELEASE_CHANNEL='preview'
          $env:PARALITH_GIT_COMMIT=(git rev-parse HEAD).Trim()
          $env:PARALITH_BUILD_TIMESTAMP=(Get-Date).ToUniversalTime().ToString('o')
          # This private repository's GitHub assets are not anonymously downloadable by installed
          # applications. Firebase therefore hosts the signed payload files; GitHub prereleases
          # remain the authenticated archive and release record.
          if (-not $env:PARALITH_PREVIEW_UPDATE_ENDPOINT) { throw 'PARALITH_PREVIEW_UPDATE_ENDPOINT repository variable is required.' }
          $env:PARALITH_UPDATE_ENDPOINT=$env:PARALITH_PREVIEW_UPDATE_ENDPOINT
          $config = node scripts/release/render-tauri-config.mjs preview release | Select-Object -Last 1
          npm run tauri -- build --bundles msi,nsis --config $config
          node scripts/release/assemble-release.mjs preview

      - name: Archive workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paralith-internal-${{ steps.version.outputs.version }}
          path: .artifacts/release/preview/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish internal release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Get-ChildItem '.artifacts/release/preview' -Directory | Select-Object -First 1
          $notes = Join-Path $dir.FullName 'release-notes.md'
          $assets = Get-ChildItem $dir.FullName -File | ForEach-Object FullName
          $tag = '${{ steps.version.outputs.tag }}'
          # Idempotent publication: a re-run of this exact commit reuses the same unique internal
          # version and therefore the same tag. Rather than fail on a duplicate tag, supersede the
          # prior — undiscoverable — internal prerelease so no duplicate accumulates. This only ever
          # touches internal prereleases; the customer Stable channel is never affected.
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Superseding existing internal prerelease $tag"
            gh release delete $tag --yes --cleanup-tag
          }
          gh release create $tag $assets `
            --title "PARALITH internal $($dir.Name)" `
            --notes-file $notes `
            --target '${{ github.sha }}' `
            --prerelease

      - name: Stage Firebase Hosting artifacts and preserve live manifests
        if: vars.PARALITH_UPDATE_PUBLISH_PROVIDER == 'firebase-hosting'
        shell: pwsh
        env:
          PARALITH_PREVIEW_UPDATE_ENDPOINT: ${{ vars.PARALITH_PREVIEW_UPDATE_ENDPOINT }}
        # The Hosting public dir MUST live beside the generated deploy config: firebase-tools
        # resolves `hosting.public` relative to the --config file's directory (.artifacts), not the
        # process CWD. Staging anywhere else yields "Directory 'update-site-dist' does not exist".
        run: node scripts/release/firebase-hosting-publisher.mjs stage ".artifacts/update-site/preview" "$env:PARALITH_PREVIEW_UPDATE_ENDPOINT" ".artifacts/update-site-dist" ".artifacts/firebase-hosting-state.json"

      - name: Authenticate to Google Cloud with Workload Identity Federation
        if: vars.PARALITH_UPDATE_PUBLISH_PROVIDER == 'firebase-hosting' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud with service-account fallback
        if: vars.PARALITH_UPDATE_PUBLISH_PROVIDER == 'firebase-hosting' && (vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_SERVICE_ACCOUNT == '')
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Generate Firebase deploy config bound to the staged Hosting directory
        if: vars.PARALITH_UPDATE_PUBLISH_PROVIDER == 'firebase-hosting'
        shell: pwsh
        env:
          FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
        # The 4th argument pins hosting.public to the absolute, normalized staging directory so the
        # deploy can never reinterpret it relative to the config file's location or the CWD.
        run: node scripts/release/firebase-hosting-publisher.mjs config "$env:FIREBASE_HOSTING_SITE" "firebase.json" ".artifacts/firebase-hosting.json" ".artifacts/update-site-dist"

      - name: Assert Firebase deploy readiness before invoking the Firebase CLI
        if: vars.PARALITH_UPDATE_PUBLISH_PROVIDER == 'firebase-hosting'
        shell: pwsh
        # Fail fast with safe diagnostics (paths, filenames, sizes — never secrets) if the staged
        # Hosting site, signed payloads, manifest state, or config public path are not coherent.
        run: node scripts/release/firebase-hosting-publisher.mjs assert-deploy-ready ".artifacts/update-site-dist" ".artifacts/update-site/preview/latest.json" ".artifacts/firebase-hosting.json"

      - name: Deploy signed Preview updater artifacts to Firebase Hosting
        if: vars.PARALITH_UPDATE_PUBLISH_PROVIDER == 'firebase-hosting'
        shell: pwsh
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: npm exec --yes "--package=firebase-tools@${{ env.FIREBASE_CLI_VERSION }}" -- firebase deploy --only hosting --project "$env:FIREBASE_PROJECT_ID" --config ".artifacts/firebase-hosting.json" --non-interactive

      - name: Verify Firebase Hosting updater artifacts before manifest activation
        if: vars.PARALITH_UPDATE_PUBLISH_PROVIDER == 'firebase-hosting'
        shell: pwsh
        run: node scripts/release/firebase-hosting-publisher.mjs verify-artifacts ".artifacts/update-site/preview/latest.json" "${{ steps.version.outputs.version }}"

      - name: Activate the new Preview manifest as the final release switch
        if: vars.PARALITH_UPDATE_PUBLISH_PROVIDER == 'firebase-hosting'
        shell: pwsh
        run: |
          node scripts/release/firebase-hosting-publisher.mjs activate ".artifacts/update-site/preview/latest.json" ".artifacts/update-site-dist"
          if ($LASTEXITCODE -ne 0) { throw "Preview manifest activation failed with exit code $LASTEXITCODE" }
          npm exec --yes "--package=firebase-tools@${{ env.FIREBASE_CLI_VERSION }}" -- firebase deploy --only hosting --project "${{ vars.FIREBASE_PROJECT_ID }}" --config ".artifacts/firebase-hosting.json" --non-interactive

      - name: Verify Firebase Hosting Preview manifest and Stable preservation
        if: vars.PARALITH_UPDATE_PUBLISH_PROVIDER == 'firebase-hosting'
        shell: pwsh
        env:
          PARALITH_PREVIEW_UPDATE_ENDPOINT: ${{ vars.PARALITH_PREVIEW_UPDATE_ENDPOINT }}
          FIREBASE_DEPLOY_VERIFY_ATTEMPTS: '4'
          FIREBASE_DEPLOY_VERIFY_DELAY_MS: '3000'
        run: node scripts/release/firebase-hosting-publisher.mjs verify "$env:PARALITH_PREVIEW_UPDATE_ENDPOINT" "${{ steps.version.outputs.version }}" ".artifacts/firebase-hosting-state.json"

      # Publishing is mandatory for a preview release. The preflight above already guaranteed the
      # required configuration is present, so this must run — it is never conditionally skipped.
      - name: Publish to internal update endpoint
        if: vars.PARALITH_UPDATE_PUBLISH_PROVIDER != 'firebase-hosting'
        shell: pwsh
        env:
          PARALITH_UPDATE_PUBLISH_TARGET: ${{ secrets.PARALITH_UPDATE_PUBLISH_TARGET }}
          PARALITH_UPDATE_PUBLISH_PROVIDER: ${{ vars.PARALITH_UPDATE_PUBLISH_PROVIDER }}
          PARALITH_UPDATE_PUBLISH_TOKEN: ${{ secrets.PARALITH_UPDATE_PUBLISH_TOKEN }}
        run: ./scripts/release/publish-internal-update.ps1

      # Prove the update is genuinely usable by an installed app: fetch the REAL published manifest
      # over HTTP and fail the release if it is not 200, not the just-released version, wrong channel,
      # or missing a reachable signed Windows artifact. A locally-correct manifest is not evidence.
      - name: Verify published preview manifest
        if: vars.PARALITH_UPDATE_PUBLISH_PROVIDER != 'firebase-hosting'
        shell: pwsh
        env:
          PARALITH_PREVIEW_UPDATE_ENDPOINT: ${{ vars.PARALITH_PREVIEW_UPDATE_ENDPOINT }}
        run: node scripts/release/verify-published-manifest.mjs preview "$env:PARALITH_PREVIEW_UPDATE_ENDPOINT" "${{ steps.version.outputs.version }}"
