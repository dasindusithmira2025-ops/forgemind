name: Release Internal

# Automatic internal delivery. Every validated main merge produces a unique, signed Preview build,
# publishes its payloads to the public artifact-only repository, and atomically activates the
# Preview manifest. Stable customers are unaffected: they read a separate manifest and only receive
# protected tag-driven `stable-v*` releases (see release-stable.yml).
#
# Runs on the repository-scoped self-hosted Windows runner. The previous `validate` job (a
# `workflow_call` into ci.yml with `full: true`) has been removed: it performed a second
# checkout, a second `npm ci`, and a full throwaway Tauri compile of the very same commit that
# this job then compiles for real. The checks themselves were not dropped -- they run inline
# below via the shared scripts/ci/run-checks.ps1, before anything expensive or publishable
# happens. A successful signed bundle build is a strictly stronger compile proof than the
# discarded --no-bundle compile it replaces.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  FIREBASE_CLI_VERSION: 13.35.1

# One internal release at a time, repository-wide. Never cancel a publish in flight: a
# half-published manifest is worse than a queued one, so concurrent dispatches serialise.
concurrency:
  group: release-internal
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish internal release
    runs-on: [self-hosted, Windows, X64, paralith, paralith-release]
    timeout-minutes: 120
    environment: preview-release
    # Preview and Stable both mutate the artifact repository's release/manifest state. Serialise the
    # final publication across every channel; optimistic blob-SHA activation is the second guard.
    concurrency:
      group: paralith-update-publication
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          clean: false

      # An internal release must never be cut from a commit that is not on main. Dispatching
      # this workflow against an arbitrary branch would otherwise publish unreviewed code to
      # every installed internal build.
      - name: Confirm the commit is on main
        run: |
          git fetch --no-tags origin main
          $sha = "$env:GITHUB_SHA"
          git merge-base --is-ancestor $sha origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Commit $sha is not an ancestor of origin/main. Internal releases must ship reviewed, merged code."
          }
          Write-Host "$sha is on main."

      # Clears .artifacts and target/release/bundle so no installer from an earlier run can be
      # globbed into this release, and asserts HEAD is exactly the dispatched commit.
      - name: Prepare workspace
        run: pwsh -NoProfile -File scripts/ci/prepare-workspace.ps1 -ExpectedSha "$env:GITHUB_SHA" -ReleaseBuild

      # Release-grade preflight: a much higher disk floor (a full bundle needs far more room
      # than validation) plus presence-only checks on the signing configuration.
      - name: Runner preflight (release)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PARALITH_PREVIEW_UPDATE_ENDPOINT: ${{ vars.PARALITH_PREVIEW_UPDATE_ENDPOINT }}
          PARALITH_UPDATE_PUBLISH_PROVIDER: ${{ vars.PARALITH_UPDATE_PUBLISH_PROVIDER }}
          PARALITH_UPDATES_REPOSITORY: ${{ vars.PARALITH_UPDATES_REPOSITORY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
        run: pwsh -NoProfile -File scripts/ci/check-self-hosted-runner.ps1 -ReleaseBuild

      - run: npm ci

      # Fail fast BEFORE the expensive Windows build: a preview release that cannot publish its
      # manifest is worthless, so a missing publish key must stop the release here rather than
      # silently produce a GitHub-only prerelease no installed app can discover. Names only, no values.
      - name: Preview publish preflight
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PARALITH_PREVIEW_UPDATE_ENDPOINT: ${{ vars.PARALITH_PREVIEW_UPDATE_ENDPOINT }}
          PARALITH_UPDATE_PUBLISH_PROVIDER: ${{ vars.PARALITH_UPDATE_PUBLISH_PROVIDER }}
          PARALITH_UPDATES_REPOSITORY: ${{ vars.PARALITH_UPDATES_REPOSITORY }}
          PARALITH_UPDATES_TOKEN: ${{ secrets.PARALITH_UPDATES_TOKEN }}
          PARALITH_PREVIEW_BRIDGE_ENDPOINT: ${{ vars.PARALITH_PREVIEW_BRIDGE_ENDPOINT }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PARALITH_INTERNAL_BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/release/preflight-publish.mjs

      # The full suite, minus the throwaway compile. Runs while the tree is still pristine, so
      # the generated-file drift check is meaningful -- the version rewrite happens next.
      - name: Run validation suite
        run: pwsh -NoProfile -File scripts/ci/run-checks.ps1 -SummaryTitle 'Pre-release validation'

      - name: Generate ephemeral internal version
        id: version
        env:
          PARALITH_INTERNAL_BUILD_NUMBER: ${{ github.run_number }}
          PARALITH_GIT_COMMIT: ${{ github.sha }}
        run: |
          # Writes release/version.json + an ephemeral changelog for this run, then propagates the
          # version to package.json / Cargo.toml / tauri.conf.json / current-release.json. These
          # edits are NEVER committed back to main — they live only inside this runner.
          node scripts/release/internal-version.mjs apply
          npm run release:sync

      - name: Confirm generated version is newer than installed Preview
        run: node scripts/release/firebase-hosting-publisher.mjs version "${{ steps.version.outputs.version }}" '0.4.1-1023'

      - name: Build signed internal MSI, NSIS, and updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PARALITH_PREVIEW_UPDATE_ENDPOINT: ${{ vars.PARALITH_PREVIEW_UPDATE_ENDPOINT }}
          PARALITH_UPDATE_PUBLISH_PROVIDER: ${{ vars.PARALITH_UPDATE_PUBLISH_PROVIDER }}
          PARALITH_UPDATES_REPOSITORY: ${{ vars.PARALITH_UPDATES_REPOSITORY }}
          PARALITH_PREVIOUS_INSTALLER_URL: ${{ vars.PARALITH_PREVIOUS_INSTALLER_URL }}
          PARALITH_ROLLOUT_PERCENT: ${{ vars.PARALITH_ROLLOUT_PERCENT }}
          PARALITH_WINDOWS_SIGN_COMMAND: ${{ secrets.PARALITH_WINDOWS_SIGN_COMMAND }}
        run: |
          # Fail closed: no updater signing key means no publishable internal build.
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'TAURI_SIGNING_PRIVATE_KEY is required.' }
          $env:PARALITH_EDITION='preview'
          $env:PARALITH_RELEASE_CHANNEL='preview'
          $env:PARALITH_GIT_COMMIT=(git rev-parse HEAD).Trim()
          $env:PARALITH_BUILD_TIMESTAMP=(Get-Date).ToUniversalTime().ToString('o')
          if ($env:PARALITH_UPDATE_PUBLISH_PROVIDER -ne 'github-artifacts') { throw 'Preview releases require the github-artifacts publisher.' }
          if (-not $env:PARALITH_UPDATES_REPOSITORY) { throw 'PARALITH_UPDATES_REPOSITORY is required.' }
          $env:PARALITH_UPDATE_ARTIFACT_BASE_URL="https://github.com/$env:PARALITH_UPDATES_REPOSITORY/releases/download/${{ steps.version.outputs.tag }}"
          if (-not $env:PARALITH_PREVIEW_UPDATE_ENDPOINT) { throw 'PARALITH_PREVIEW_UPDATE_ENDPOINT repository variable is required.' }
          $env:PARALITH_UPDATE_ENDPOINT=$env:PARALITH_PREVIEW_UPDATE_ENDPOINT
          $config = node scripts/release/render-tauri-config.mjs preview release | Select-Object -Last 1
          npm run tauri -- build --bundles msi,nsis --config $config
          node scripts/release/assemble-release.mjs preview

      # Confirms MSI and NSIS were actually produced for THIS version before anything is
      # published, so a silently missing bundle cannot become a green release.
      - name: Verify packaged installers
        run: |
          $dir = Get-ChildItem '.artifacts/release/preview' -Directory | Select-Object -First 1
          if (-not $dir) { throw 'No assembled release directory was produced.' }
          $version = '${{ steps.version.outputs.version }}'
          $files = Get-ChildItem $dir.FullName -File
          foreach ($ext in @('.msi', '.exe')) {
            $match = $files | Where-Object { $_.Extension -eq $ext }
            if (-not $match) { throw "No $ext installer was produced in $($dir.FullName)." }
            foreach ($m in $match) { Write-Host ("{0}  {1} MB" -f $m.Name, [math]::Round($m.Length / 1MB, 2)) }
          }
          # Stale-artifact guard: every installer must carry the version just generated.
          $wrong = $files | Where-Object { $_.Extension -in '.msi', '.exe' -and $_.Name -notlike "*$version*" }
          if ($wrong) {
            throw "Installer(s) do not carry version ${version}: $($wrong.Name -join ', ')"
          }
          Write-Host "MSI and NSIS installers verified for $version."

      - name: Archive workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paralith-internal-${{ steps.version.outputs.version }}
          path: .artifacts/release/preview/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish internal release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Get-ChildItem '.artifacts/release/preview' -Directory | Select-Object -First 1
          $notes = Join-Path $dir.FullName 'release-notes.md'
          $assets = Get-ChildItem $dir.FullName -File | ForEach-Object FullName
          $tag = '${{ steps.version.outputs.tag }}'
          # Idempotent publication: a re-run of this exact commit reuses the same unique internal
          # version and therefore the same tag. Rather than fail on a duplicate tag, supersede the
          # prior — undiscoverable — internal prerelease so no duplicate accumulates. This only ever
          # touches internal prereleases; the customer Stable channel is never affected.
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Superseding existing internal prerelease $tag"
            gh release delete $tag --yes --cleanup-tag
          }
          gh release create $tag $assets `
            --title "PARALITH internal $($dir.Name)" `
            --notes-file $notes `
            --target '${{ github.sha }}' `
            --prerelease

      - name: Publish public signed updater assets and activate Preview manifest
        env:
          PARALITH_UPDATES_REPOSITORY: ${{ vars.PARALITH_UPDATES_REPOSITORY }}
          PARALITH_UPDATES_TOKEN: ${{ secrets.PARALITH_UPDATES_TOKEN }}
        run: |
          $dir = Get-ChildItem '.artifacts/release/preview' -Directory | Select-Object -First 1
          node scripts/release/github-artifacts-publisher.mjs publish preview "${{ steps.version.outputs.tag }}" "$($dir.FullName)" "${{ steps.version.outputs.version }}"

      - name: Authenticate to Google Cloud with Workload Identity Federation
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud with service-account fallback
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_SERVICE_ACCOUNT == ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Stage JSON-only Firebase bridge for installed Preview 0.4.1-1023
        env:
          PARALITH_PREVIEW_BRIDGE_ENDPOINT: ${{ vars.PARALITH_PREVIEW_BRIDGE_ENDPOINT }}
          PARALITH_UPDATES_REPOSITORY: ${{ vars.PARALITH_UPDATES_REPOSITORY }}
        run: |
          node scripts/release/firebase-manifest-bridge.mjs stage ".artifacts/update-site/preview/latest.json" "$env:PARALITH_PREVIEW_BRIDGE_ENDPOINT" ".artifacts/update-bridge-dist" ".artifacts/firebase-bridge-state.json" "${{ steps.version.outputs.version }}" "$env:PARALITH_UPDATES_REPOSITORY"

      - name: Generate Firebase deploy config for the JSON-only bridge
        env:
          FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
        run: node scripts/release/firebase-hosting-publisher.mjs config "$env:FIREBASE_HOSTING_SITE" "firebase.json" ".artifacts/firebase-hosting.json" ".artifacts/update-bridge-dist"

      - name: Assert Firebase bridge contains no executable payloads
        run: node scripts/release/firebase-manifest-bridge.mjs assert-json-only ".artifacts/update-bridge-dist"

      - name: Deploy JSON-only Preview compatibility bridge to Firebase Hosting
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: npm exec --yes "--package=firebase-tools@${{ env.FIREBASE_CLI_VERSION }}" -- firebase deploy --only hosting --project "$env:FIREBASE_PROJECT_ID" --config ".artifacts/firebase-hosting.json" --non-interactive

      - name: Verify installed Preview bridge and public payload anonymously
        env:
          PARALITH_PREVIEW_BRIDGE_ENDPOINT: ${{ vars.PARALITH_PREVIEW_BRIDGE_ENDPOINT }}
          PARALITH_UPDATES_REPOSITORY: ${{ vars.PARALITH_UPDATES_REPOSITORY }}
        run: node scripts/release/firebase-manifest-bridge.mjs verify "$env:PARALITH_PREVIEW_BRIDGE_ENDPOINT" "${{ steps.version.outputs.version }}" "$env:PARALITH_UPDATES_REPOSITORY" ".artifacts/firebase-bridge-state.json"

      # Secret-safe cleanup, and a genuine backstop rather than decoration. The Google auth
      # action normally deletes its own credential file in its post step, but that post step
      # does not always run (a hard-cancelled job can skip it), and this machine keeps its disk
      # between jobs. Observed behaviour: the action writes the file into GITHUB_WORKSPACE, not
      # RUNNER_TEMP, so sweeping only RUNNER_TEMP would clean nothing at all. Sweep both, plus
      # the exact path the action exports.
      - name: Remove temporary credential files
        if: always()
        run: pwsh -NoProfile -File scripts/ci/sweep-credentials.ps1

      - name: Clean up abandoned build processes
        if: always()
        run: pwsh -NoProfile -File scripts/ci/cleanup-runner-processes.ps1
