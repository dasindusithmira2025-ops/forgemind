name: Runner Diagnostics

# Proves the self-hosted Paralith runner is reachable, correctly labelled, and carries a
# working toolchain. Deliberately cheap: it compiles nothing, bundles no installer, and
# publishes no release. Manual trigger only -- this is an operator tool, not a gate.

on:
  workflow_dispatch:

# Read-only. The diagnostic never needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: runner-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Self-hosted runner diagnostics
    # Specific labels, never a bare `self-hosted`: this must land on the Paralith machine.
    runs-on: [self-hosted, Windows, X64, paralith]
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
        working-directory: Paralith-tauri
    steps:
      # `clean: false` protects node_modules and the ~75 GB Rust target directory. The
      # diagnostic does not build, so it does not even need a prepared workspace.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: false

      - name: Report runner identity and labels
        working-directory: .
        run: |
          # Quote every expansion: none of these values are trusted as code.
          Write-Host "runner name   : $env:RUNNER_NAME"
          Write-Host "runner os     : $env:RUNNER_OS / $env:RUNNER_ARCH"
          Write-Host "workspace     : $env:GITHUB_WORKSPACE"
          Write-Host "runner temp   : $env:RUNNER_TEMP"
          Write-Host "commit        : $env:GITHUB_SHA"
          if ($env:RUNNER_NAME -ne 'paralith-windows-release') {
            throw "Job landed on '$env:RUNNER_NAME'; expected 'paralith-windows-release'."
          }
          Write-Host 'Correct runner.' -ForegroundColor Green

      - name: Verify checkout matches the triggering commit
        working-directory: .
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) {
            throw "Checkout is at $head but the event commit is $env:GITHUB_SHA."
          }
          Write-Host "Checkout verified at $head"

      - name: Verify write access inside the workspace
        working-directory: .
        run: |
          # Confirms the runner account can actually create and delete files in the
          # workspace -- a permissions problem here breaks every later build.
          $probe = Join-Path $env:GITHUB_WORKSPACE ".runner-write-probe-$env:GITHUB_RUN_ID"
          Set-Content -LiteralPath $probe -Value 'probe' -Encoding utf8
          if ((Get-Content -LiteralPath $probe -Raw).Trim() -ne 'probe') { throw 'Write probe read back wrong content.' }
          Remove-Item -LiteralPath $probe -Force
          if (Test-Path -LiteralPath $probe) { throw 'Write probe could not be deleted.' }
          Write-Host 'Workspace is writable and cleanable.'

      # The single source of truth for toolchain expectations, shared with the real builds.
      # Emits its own secret-safe job summary table.
      - name: Toolchain preflight
        run: pwsh -NoProfile -File scripts/ci/check-self-hosted-runner.ps1

      - name: Diagnostic summary
        if: always()
        working-directory: .
        run: |
          # Names only -- no secret values are read, printed, or written here.
          $rows = @(
            "| Runner | ``$env:RUNNER_NAME`` |"
            "| OS / arch | ``$env:RUNNER_OS`` / ``$env:RUNNER_ARCH`` |"
            "| Commit | ``$env:GITHUB_SHA`` |"
            "| Workspace | ``$env:GITHUB_WORKSPACE`` |"
          )
          $md = @('### Runner diagnostics', '', '| Item | Value |', '|---|---|') + $rows
          $md += @('', 'No installers were built and no release was published by this workflow.')
          ($md -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # Persistent runner: always tidy up, including after cancellation.
      - name: Clean up abandoned build processes
        if: always()
        working-directory: .
        run: pwsh -NoProfile -File scripts/ci/cleanup-runner-processes.ps1
