name: Validate

# Desktop validation stays in one Windows job so the frontend and Rust gates share one checkout,
# one dependency install, and one Cargo download cache. Pull requests perform the native compile;
# main receives the already-reviewed commit and avoids a redundant third release-sized build.
on:
  pull_request:
    paths:
      - 'Paralith-tauri/**'
      - '!Paralith-tauri/**/*.md'
      - 'scripts/ci/**'
      - '.gitattributes'
      - '.gitignore'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release-stable.yml'
  push:
    branches: [main, integration]
    paths:
      - 'Paralith-tauri/**'
      - '!Paralith-tauri/**/*.md'
      - 'scripts/ci/**'
      - '.gitattributes'
      - '.gitignore'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release-stable.yml'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate desktop (GitHub Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: Paralith-tauri

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Exact Node also fixes the bundled npm version so lockfile validation cannot drift
          # when GitHub refreshes the hosted image.
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: Paralith-tauri/package-lock.json

      - name: Configure Rust toolchain
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add x86_64-pc-windows-msvc
          rustc --version
          cargo --version

      # Cache downloaded sources only. Cargo target output is intentionally excluded because it
      # embeds absolute paths and is too large for a repository-wide GitHub cache.
      - name: Restore Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Paralith-tauri/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install locked dependencies
        run: npm ci

      - name: Run validation suite
        run: |
          pwsh -NoProfile -File scripts/ci/run-checks.ps1 `
            -SummaryTitle 'Validation' `
            ${{ github.event_name == 'pull_request' && '-IncludeTauriCompile' || '' }}
