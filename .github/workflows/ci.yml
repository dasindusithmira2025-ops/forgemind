name: Validate

on:
  pull_request:
  push:
    branches: [main, integration]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Canonical release metadata
        run: npm run release:check
      - name: TypeScript
        run: npm run typecheck
      - name: Frontend lint
        run: npm run lint
      - name: Frontend tests
        run: npm test -- --run
      - name: Production frontend build
        run: npm run build
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust and migration tests
        working-directory: src-tauri
        run: cargo test --all-targets --all-features
      - name: Tauri compilation
        shell: pwsh
        run: |
          $env:PARALITH_EDITION='stable'
          $env:PARALITH_RELEASE_CHANNEL='stable'
          $env:PARALITH_UPDATE_ENDPOINT='https://updates.invalid/paralith/stable/latest.json'
          npm run tauri -- build --no-bundle --config src-tauri/tauri.stable.conf.json
      - name: Generated files and clean diff
        shell: pwsh
        run: |
          npm run release:sync
          git diff --exit-code -- package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json release/generated/current-release.json
