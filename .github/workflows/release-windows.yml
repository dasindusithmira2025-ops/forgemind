name: Release Windows (reusable)

# Tag-driven edition release (preview-v* / stable-v*). Runs on the repository-scoped
# self-hosted Windows runner.
#
# The former `validate` job -- a `workflow_call` into ci.yml with `full: true` -- has been
# removed for two reasons. It compiled the crate a second time for the same commit that this
# job compiles for real, and in `workflow_dispatch` mode it validated the WRONG commit:
# ci.yml resolves `github.sha` to the dispatched branch, not to the `inputs.tag` this job
# actually builds. The checks now run inline, against the tagged checkout, via the shared
# Paralith-tauri/scripts/ci/run-checks.ps1.

on:
  workflow_call:
    inputs:
      edition:
        required: true
        type: string
      tag:
        required: true
        type: string

permissions:
  contents: write

# A release publishes artifacts and mutates an updater manifest. Never cancel one in flight — a
# half-published manifest is worse than a queued one — so this lock serialises instead.
concurrency:
  group: release-windows-${{ inputs.edition }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ inputs.edition }} ${{ inputs.tag }}
    runs-on: [self-hosted, Windows, X64, paralith, paralith-release]
    timeout-minutes: 120
    environment: ${{ inputs.edition }}-release
    concurrency:
      group: paralith-update-publication
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
        working-directory: Paralith-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          clean: false

      # Clears .artifacts and target/release/bundle so nothing from a previous run can be
      # published, and confirms the tagged tree is clean.
      - name: Prepare workspace
        working-directory: .
        run: pwsh -NoProfile -File scripts/ci/prepare-workspace.ps1 -ReleaseBuild

      - name: Runner preflight (release)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pwsh -NoProfile -File scripts/ci/check-self-hosted-runner.ps1 -ReleaseBuild

      - run: npm ci

      - name: Public updater publication preflight
        env:
          PARALITH_UPDATE_PUBLISH_PROVIDER: ${{ vars.PARALITH_UPDATE_PUBLISH_PROVIDER }}
          PARALITH_UPDATES_REPOSITORY: ${{ vars.PARALITH_UPDATES_REPOSITORY }}
          PARALITH_UPDATES_TOKEN: ${{ secrets.PARALITH_UPDATES_TOKEN }}
          PARALITH_UPDATES_DEPLOY_KEY: ${{ secrets.PARALITH_UPDATES_DEPLOY_KEY }}
          PARALITH_STABLE_UPDATE_ENDPOINT: ${{ vars.PARALITH_STABLE_UPDATE_ENDPOINT }}
          PARALITH_PREVIEW_UPDATE_ENDPOINT: ${{ vars.PARALITH_PREVIEW_UPDATE_ENDPOINT }}
          PARALITH_UPDATE_MIRROR_BASE_URL: ${{ vars.PARALITH_UPDATE_MIRROR_BASE_URL }}
          PARALITH_UPDATE_MIRROR_MODE: ${{ vars.PARALITH_UPDATE_MIRROR_MODE }}
        run: |
          if ($env:PARALITH_UPDATE_PUBLISH_PROVIDER -ne 'github-artifacts') { throw 'Protected channel releases require PARALITH_UPDATE_PUBLISH_PROVIDER=github-artifacts.' }
          if (-not $env:PARALITH_UPDATES_REPOSITORY) { throw 'PARALITH_UPDATES_REPOSITORY is required.' }
          if (-not $env:PARALITH_UPDATES_TOKEN -and -not $env:PARALITH_UPDATES_DEPLOY_KEY) { throw 'PARALITH_UPDATES_TOKEN or PARALITH_UPDATES_DEPLOY_KEY is required.' }
          # Derives and validates the endpoint and installer base URL for this release, honouring an
          # optional third-party mirror, and exports them so nothing downstream rebuilds them by hand.
          node scripts/release/update-distribution.mjs '${{ inputs.edition }}' '${{ inputs.tag }}'

      - name: Validate protected release tag
        run: npm run release:check

      - name: Verify clean tagged source and release identity
        run: |
          if (git status --porcelain) { throw 'Release checkout is not clean.' }
          node scripts/release/verify-release.mjs '${{ inputs.edition }}' '${{ inputs.tag }}'

      # The full suite against the tagged commit, minus the throwaway compile: the signed
      # bundle build below is the compile proof.
      - name: Run validation suite
        run: pwsh -NoProfile -File scripts/ci/run-checks.ps1 -SummaryTitle 'Pre-release validation (${{ inputs.tag }})'

      - name: Build signed MSI, NSIS, and updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PARALITH_STABLE_UPDATE_ENDPOINT: ${{ vars.PARALITH_STABLE_UPDATE_ENDPOINT }}
          PARALITH_PREVIEW_UPDATE_ENDPOINT: ${{ vars.PARALITH_PREVIEW_UPDATE_ENDPOINT }}
          PARALITH_UPDATE_PUBLISH_PROVIDER: ${{ vars.PARALITH_UPDATE_PUBLISH_PROVIDER }}
          PARALITH_UPDATES_REPOSITORY: ${{ vars.PARALITH_UPDATES_REPOSITORY }}
          PARALITH_PREVIOUS_INSTALLER_URL: ${{ vars.PARALITH_PREVIOUS_INSTALLER_URL }}
          PARALITH_ROLLOUT_PERCENT: ${{ vars.PARALITH_ROLLOUT_PERCENT }}
          PARALITH_WINDOWS_SIGN_COMMAND: ${{ secrets.PARALITH_WINDOWS_SIGN_COMMAND }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'TAURI_SIGNING_PRIVATE_KEY is required.' }
          $env:PARALITH_EDITION='${{ inputs.edition }}'
          $env:PARALITH_RELEASE_CHANNEL='${{ inputs.edition }}'
          $env:PARALITH_GIT_COMMIT=(git rev-parse HEAD).Trim()
          $env:PARALITH_BUILD_TIMESTAMP=(Get-Date).ToUniversalTime().ToString('o')
          # PARALITH_UPDATE_ENDPOINT and PARALITH_UPDATE_ARTIFACT_BASE_URL were derived and validated
          # by the publication preflight step and exported through $GITHUB_ENV.
          if (-not $env:PARALITH_UPDATE_ENDPOINT) { throw 'PARALITH_UPDATE_ENDPOINT was not resolved by the publication preflight.' }
          if (-not $env:PARALITH_UPDATE_ARTIFACT_BASE_URL) { throw 'PARALITH_UPDATE_ARTIFACT_BASE_URL was not resolved by the publication preflight.' }
          $config = node scripts/release/render-tauri-config.mjs '${{ inputs.edition }}' release | Select-Object -Last 1
          npm run tauri -- build --bundles msi,nsis --config $config
          node scripts/release/assemble-release.mjs '${{ inputs.edition }}'

      # Confirms both installer formats were genuinely produced before anything is published.
      - name: Verify packaged installers
        run: |
          $dir = Get-ChildItem '.artifacts/release/${{ inputs.edition }}' -Directory | Select-Object -First 1
          if (-not $dir) { throw 'No assembled release directory was produced.' }
          $files = Get-ChildItem $dir.FullName -File
          foreach ($ext in @('.msi', '.exe')) {
            $match = $files | Where-Object { $_.Extension -eq $ext }
            if (-not $match) { throw "No $ext installer was produced in $($dir.FullName)." }
            foreach ($m in $match) { Write-Host ("{0}  {1} MB" -f $m.Name, [math]::Round($m.Length / 1MB, 2)) }
          }

      - name: Archive workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paralith-${{ inputs.edition }}-${{ inputs.tag }}
          path: Paralith-tauri/.artifacts/release/${{ inputs.edition }}/**
          if-no-files-found: error
          retention-days: 90

      - name: Create private repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Get-ChildItem '.artifacts/release/${{ inputs.edition }}' -Directory | Select-Object -First 1
          $notes = Join-Path $dir.FullName 'release-notes.md'
          $assets = Get-ChildItem $dir.FullName -File | ForEach-Object FullName
          $pre = if ('${{ inputs.edition }}' -eq 'preview') { '--prerelease' } else { $null }
          $commit = (git rev-parse HEAD).Trim()
          gh release create '${{ inputs.tag }}' $assets --title "PARALITH ${{ inputs.edition }} $($dir.Name)" --notes-file $notes --target $commit $pre

      - name: Publish public signed updater assets and activate channel manifest
        env:
          PARALITH_UPDATES_REPOSITORY: ${{ vars.PARALITH_UPDATES_REPOSITORY }}
          PARALITH_UPDATES_TOKEN: ${{ secrets.PARALITH_UPDATES_TOKEN }}
          PARALITH_UPDATES_DEPLOY_KEY: ${{ secrets.PARALITH_UPDATES_DEPLOY_KEY }}
          PARALITH_UPDATE_MIRROR_BASE_URL: ${{ vars.PARALITH_UPDATE_MIRROR_BASE_URL }}
          PARALITH_UPDATE_MIRROR_MODE: ${{ vars.PARALITH_UPDATE_MIRROR_MODE }}
        run: |
          $dir = Get-ChildItem '.artifacts/release/${{ inputs.edition }}' -Directory | Select-Object -First 1
          if ($env:PARALITH_UPDATES_DEPLOY_KEY) {
            pwsh -NoProfile -File scripts/release/push-publication-handoff.ps1 -Channel '${{ inputs.edition }}' -Tag '${{ inputs.tag }}' -SourceDirectory "$($dir.FullName)" -Version "$($dir.Name)"
          } else {
            node scripts/release/github-artifacts-publisher.mjs publish '${{ inputs.edition }}' '${{ inputs.tag }}' "$($dir.FullName)" "$($dir.Name)"
          }

      # A push mirror only holds what we upload, so this runs after the canonical publication has
      # already succeeded: the origin is never left behind a mirror. Skipped entirely when no mirror
      # is configured. Ordering (installers first, manifest last, activated by atomic rename) is
      # enforced by the generated sftp batch, not by this step.
      - name: Publish to the partner-hosted mirror
        if: ${{ vars.PARALITH_UPDATE_MIRROR_BASE_URL != '' }}
        env:
          PARALITH_UPDATE_MIRROR_MODE: ${{ vars.PARALITH_UPDATE_MIRROR_MODE }}
          PARALITH_MIRROR_SSH_HOST: ${{ vars.PARALITH_MIRROR_SSH_HOST }}
          PARALITH_MIRROR_SSH_PORT: ${{ vars.PARALITH_MIRROR_SSH_PORT }}
          PARALITH_MIRROR_SSH_USER: ${{ vars.PARALITH_MIRROR_SSH_USER }}
          PARALITH_MIRROR_REMOTE_ROOT: ${{ vars.PARALITH_MIRROR_REMOTE_ROOT }}
          PARALITH_MIRROR_SSH_KEY: ${{ secrets.PARALITH_MIRROR_SSH_KEY }}
          PARALITH_MIRROR_SSH_HOST_KEY: ${{ secrets.PARALITH_MIRROR_SSH_HOST_KEY }}
        run: |
          $dir = Get-ChildItem '.artifacts/release/${{ inputs.edition }}' -Directory | Select-Object -First 1
          pwsh -NoProfile -File scripts/release/push-mirror-publication.ps1 -Channel '${{ inputs.edition }}' -Tag '${{ inputs.tag }}' -SourceDirectory "$($dir.FullName)"

      # The canonical origin is proven by the publisher itself. This proves the URL that installed
      # apps will actually poll, which is a different host whenever a mirror is configured. A mirror
      # is usually cold right after publication, so the check retries while it pulls from the origin.
      - name: Verify the live update endpoint installed apps will poll
        run: |
          $dir = Get-ChildItem '.artifacts/release/${{ inputs.edition }}' -Directory | Select-Object -First 1
          node scripts/release/verify-published-manifest.mjs '${{ inputs.edition }}' "$env:PARALITH_UPDATE_ENDPOINT" "$($dir.Name)" --attempts=30

      - name: Clean up abandoned build processes
        if: always()
        working-directory: .
        run: pwsh -NoProfile -File scripts/ci/cleanup-runner-processes.ps1
